<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wish list · Aidan Stengel</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .list { border-top: 2px solid var(--ink); margin: 0; padding: 0; list-style: none; }
    .item {
      display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: baseline;
      padding: 22px 0; border-bottom: 1px solid var(--grid);
    }
    .item h3 { font: 600 1.2rem/1.3 var(--display); margin: 0; }
    .item h3 a { color: var(--ink); text-decoration-color: var(--grid); text-underline-offset: 4px; }
    .item h3 a:hover { text-decoration-color: var(--cobalt); }
    .item .price { font-size: 17px; color: var(--soft); white-space: nowrap; }
    .item .note { grid-column: 1 / -1; margin: 0; color: var(--soft); max-width: 60ch; }
    .item.top h3::after {
      content: "Really want this"; margin-left: 12px; padding: 2px 8px; vertical-align: 3px;
      background: var(--select); font: 600 13px/1.4 var(--body); color: var(--ink);
    }
    .empty { border-top: 2px solid var(--ink); padding: 28px 0; color: var(--soft); }
  </style>
</head>
<body>

<header class="topbar">
  <div class="in">
    <a class="home" href="/">Aidan Stengel</a>
    <nav aria-label="Site">
      <a href="/resume/">Resume</a>
      <a href="/gifts/" aria-current="page">Wish list</a>
    </nav>
  </div>
</header>

<div class="page-head">
  <h1>Wish list</h1>
  <p>Things I'd love to get. Items marked "Really want this" are at the top of the list.</p>
</div>

<main>
  <section>
    <div id="list-root"><p class="empty">Nothing on the list yet. Check back soon.</p></div>
  </section>
</main>

<footer>
  <span>© <span id="yr"></span> Aidan Stengel</span>
  <a href="/">Home</a>
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  fetch('items.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (items) {
      if (!Array.isArray(items) || !items.length) return;
      items.sort(function (a, b) { return (b.top ? 1 : 0) - (a.top ? 1 : 0); });
      var ul = document.createElement('ul');
      ul.className = 'list';
      items.forEach(function (it) {
        var li = document.createElement('li');
        li.className = 'item' + (it.top ? ' top' : '');
        var h = document.createElement('h3');
        if (it.link) {
          var a = document.createElement('a');
          a.href = it.link; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = it.name; h.appendChild(a);
        } else { h.textContent = it.name; }
        li.appendChild(h);
        var p = document.createElement('span');
        p.className = 'price'; p.textContent = it.price || '';
        li.appendChild(p);
        if (it.note) {
          var n = document.createElement('p');
          n.className = 'note'; n.textContent = it.note; li.appendChild(n);
        }
        ul.appendChild(li);
      });
      var root = document.getElementById('list-root');
      root.innerHTML = ''; root.appendChild(ul);
    })
    .catch(function () {});
</script>
</body>
</html>
