# Rebuilds resume.pdf whenever the resume page or site styles change.
name: Rebuild resume PDF
on:
  push:
    branches: [main]
    paths: ['resume/**', 'assets/site.css', 'tools/build-resume-pdf.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/build-resume-pdf.mjs
      - name: Commit the PDF if it changed
        run: |
          if git diff --quiet -- resume.pdf; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git commit -m "Rebuild resume.pdf"
          git push
